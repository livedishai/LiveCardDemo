<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Japanese Scripts · Pinocchio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#F0E2B8;--cream:#FDF0D0;--cream2:#FBE6B0;
  --crimson:#8B0A1A;--red:#C8202F;--red-dark:#7A0A18;--gold:#B8923A;
  --line:rgba(139,10,26,.2);
  --ff-display:'Playfair Display',Georgia,serif;
  --ff-ui:'Inter',system-ui,sans-serif;
  --ff-jp:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--crimson);font-family:var(--ff-ui);
  min-height:100svh;
  padding:max(env(safe-area-inset-top),16px) 14px max(env(safe-area-inset-bottom),28px);
}
.back{
  display:inline-block;text-decoration:none;color:var(--crimson);background:var(--cream);
  padding:10px 16px;border-radius:999px;font-size:12px;font-weight:600;
  box-shadow:0 6px 18px rgba(139,10,26,.15);
}
.wrap{
  max-width:760px;margin:16px auto 0;
  background:linear-gradient(160deg,var(--cream),var(--cream2));
  border:1px solid rgba(255,255,255,.7);border-radius:32px;
  box-shadow:0 24px 50px rgba(139,10,26,.14);
  padding:30px 18px 24px;
}
header{text-align:center}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--red)}
h1{font-family:var(--ff-display);font-weight:700;font-size:clamp(34px,9vw,50px);letter-spacing:.05em;margin-top:8px;line-height:1.1}
.sub{font-family:var(--ff-display);font-style:italic;font-weight:500;font-size:18px;margin-top:6px}
.divider{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px auto 18px;width:60%}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line))}
.divider::after{transform:scaleX(-1)}
.divider i{width:9px;height:9px;background:var(--red);transform:rotate(45deg)}
.note{font-size:13px;line-height:1.6;max-width:520px;margin:0 auto;opacity:.85}

.tools{display:flex;flex-direction:column;gap:12px;margin:22px 0 12px}
.search{
  width:100%;padding:13px 18px;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,248,230,.85);font:500 14px var(--ff-ui);color:var(--crimson);
}
.search::placeholder{color:rgba(139,10,26,.5)}
.search:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:rgba(255,248,230,.85);color:var(--crimson);
  padding:9px 16px;border-radius:999px;font:600 12.5px var(--ff-ui);cursor:pointer;
}
.chip.on{background:linear-gradient(135deg,var(--red),var(--red-dark));color:var(--cream);border-color:transparent;box-shadow:0 6px 14px rgba(139,10,26,.25)}
.count{font-size:12px;color:var(--gold);font-weight:600;margin:2px 4px 10px}

.group{display:flex;align-items:center;gap:10px;margin:18px 4px 8px;font-family:var(--ff-display);font-weight:700;font-size:19px}
.group::before{content:"";width:8px;height:8px;background:var(--red);transform:rotate(45deg)}
.group span{font:600 11px var(--ff-ui);color:var(--gold);margin-left:auto}

.item{
  display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;margin-bottom:10px;
  background:rgba(255,248,230,.8);border:1px solid var(--line);border-radius:22px;
  box-shadow:0 6px 16px rgba(139,10,26,.07);cursor:pointer;transition:transform .15s,box-shadow .15s;
}
.item:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(139,10,26,.15)}
.txt{flex:1;min-width:0}
.en{font-weight:600;font-size:14.5px}
.ctx{font-size:11.5px;color:var(--gold);font-weight:500;margin-top:1px}
.jp{font-family:var(--ff-jp);font-weight:700;font-size:19px;line-height:1.4;margin-top:8px;word-break:break-word}
.rom{font-size:13px;font-weight:500;color:var(--red);margin-top:2px;font-style:italic}
.spk{
  flex:0 0 44px;height:44px;border-radius:50%;border:0;cursor:pointer;font-size:17px;color:var(--cream2);
  background:linear-gradient(135deg,var(--red),var(--red-dark));box-shadow:0 8px 16px rgba(139,10,26,.28);
}
.spk.live{animation:pulse .8s ease infinite alternate}
@keyframes pulse{from{box-shadow:0 0 0 0 rgba(200,32,47,.5)}to{box-shadow:0 0 0 10px rgba(200,32,47,0)}}
.empty{text-align:center;padding:36px 10px;font-style:italic;opacity:.7}
.foot{text-align:center;font-size:12.5px;line-height:1.6;margin-top:20px;opacity:.85}

dialog{
  margin:auto;width:min(92vw,440px);border:0;border-radius:32px;padding:28px 22px;text-align:center;
  background:linear-gradient(160deg,var(--cream),var(--cream2));color:var(--crimson);
  box-shadow:0 30px 70px rgba(80,10,20,.4);

.big{font-family:var(--ff-jp);font-weight:700;font-size:clamp(28px,8vw,38px);line-height:1.4;margin:6px 0}
.dlg-rom{font-style:italic;color:var(--red);font-weight:500}
.dlg-en{font-family:var(--ff-display);font-weight:600;font-size:18px;margin-top:10px}
.dlg-label{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);font-weight:600}
.dlg-btns{display:flex;gap:10px;justify-content:center;margin-top:20px}
.pill{border:0;border-radius:999px;padding:12px 20px;font:600 13px var(--ff-ui);cursor:pointer}
.pill.red{background:linear-gradient(135deg,var(--red),var(--red-dark));color:var(--cream);box-shadow:0 8px 16px rgba(139,10,26,.28)}
.pill.light{background:var(--cream);color:var(--crimson);border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<a class="back" href="FunZone.html">← FunZone</a>

<main class="wrap">
  <header>
    <p class="eyebrow">Nihongo</p>
    <h1>Japanese Scripts</h1>
    <p class="sub">Phrases for the table and for new friends</p>
    <div class="divider"><i></i></div>
    <p class="note">Tap 🔊 to hear a phrase. Tap anywhere else on a card to show it to your server in large text.</p>
  </header>

  <div class="tools">
    <input class="search" id="q" type="search" placeholder="Search phrases, e.g. water, bill, thanks" aria-label="Search phrases">
  </div>

  <div class="chips" id="chips"></div>
  <p class="count" id="count"></p>
  <div id="list"></div>

  <p class="foot">There is no tipping in Japan. A warm <b>ごちそうさまでした</b> is the best thank-you.</p>
</main>

<dialog id="dlg">
  <p class="dlg-label">Show to staff</p>
  <div class="big" id="d-jp"></div>
  <div class="dlg-rom" id="d-rom"></div>
  <div class="dlg-en" id="d-en"></div>
  <div class="dlg-btns">
    <button class="pill red" id="d-say">🔊 Hear it</button>
    <button class="pill light" id="d-close">Close</button>
  </div>
</dialog>

`;
const CATS=[["all","All"],["arrive","Arriving"],["order","Ordering"],["diet","Diet & allergies"],["meal","At the table"],["pay","Paying"],["chat","Friendly chat"],["bye","Thanks & goodbye"],["help","Help"]];
const NAME=Object.fromEntries(CATS);
const L=RAW.trim().split('\n').map((r,id)=>{const [cat,en,ctx,jp,kana,rom]=r.split('|');return{id,cat,en,ctx,jp,kana,rom}});

let cat='all',q='';
const $=id=>document.getElementById(id);
const disp=w=>w.jp;

function chips(){
  $('chips').innerHTML=CATS.map(([id,n])=>`<button class="chip${id===cat?' on':''}" data-c="${id}">${n}</button>`).join('');
}
function row(w){
  return `<div class="item" data-i="${w.id}" tabindex="0" role="button" aria-label="Show ${w.en} to staff">
    <div class="txt"><div class="en">${w.en}</div><div class="ctx">${w.ctx}</div>
    <div class="jp">${disp(w)}</div><div class="rom">${w.rom}</div></div>
    <button class="spk" aria-label="Hear ${w.en}">🔊</button></div>`;
}
function render(){
  const s=q.trim().toLowerCase();
  const f=L.filter(w=>(cat==='all'||w.cat===cat)&&(!s||(w.en+w.ctx+w.rom).toLowerCase().includes(s)));
  $('count').textContent=`${f.length} phrase${f.length===1?'':'s'}`+(cat!=='all'?` · ${NAME[cat]}`:'');
  if(!f.length){$('list').innerHTML='<p class="empty">No phrases found. Try another word.</p>';return}
  if(cat==='all'&&!s){
    $('list').innerHTML=CATS.slice(1).map(([id,n])=>{
      const g=f.filter(w=>w.cat===id);
      return g.length?`<div class="group">${n}<span>${g.length}</span></div>`+g.map(row).join(''):'';
    }).join('');
  }else $('list').innerHTML=f.map(row).join('');
}

function say(w,btn){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(w.jp.replace(/_+/g,''));
  u.lang='ja-JP';u.rate=.9;
  document.querySelectorAll('.live').forEach(b=>b.classList.remove('live'));
  if(btn)btn.classList.add('live');
  u.onend=u.onerror=()=>btn&&btn.classList.remove('live');
  speechSynthesis.speak(u);
}

let cur=null;
function openDlg(w){
  cur=w;
  $('d-jp').textContent=disp(w);$('d-rom').textContent=w.rom;$('d-en').textContent=w.en;
  $('dlg').showModal();
}

$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c;chips();render()});
$('q').addEventListener('input',e=>{q=e.target.value;render()});
$('list').addEventListener('click',e=>{
  const it=e.target.closest('.item');if(!it)return;
  const w=L[it.dataset.i];
  if(e.target.closest('.spk'))say(w,it.querySelector('.spk'));else openDlg(w);
});
$('list').addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('item')){e.preventDefault();openDlg(L[e.target.dataset.i])}
});
$('d-say').addEventListener('click',()=>cur&&say(cur,null));
$('d-close').addEventListener('click',()=>$('dlg').close());
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))$('dlg').close()});
$('dlg').addEventListener('close',()=>speechSynthesis&&speechSynthesis.cancel());

chips();render();
</script>
</body>
</html>
